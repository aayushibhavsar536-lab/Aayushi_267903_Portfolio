<!DOCTYPE html>
<html>
<body>

<h2>Input Event Example</h2>

<input type="text" id="textBox" placeholder="Type something here">

<p id="output"></p>

<script>
document.getElementById("textBox").addEventListener("input", function() {
    document.getElementById("output").innerText = this.value;
});
</script>

</body>
</html>
